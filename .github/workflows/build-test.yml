name: Build Test APK

# 每次 push 到 main / 开 PR 时，构建 debug APK 作为产物上传（用于验证 CI 是否跑通）。
# 无需签名密钥，debug 包自带 debug 签名、可直接安装测试。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter (3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # clipboard_watcher 0.3.0 在 android/build.gradle 写死 compileSdk 33，
      # 但其 AndroidX 依赖要求 compileSdk >= 34，CI 全新拉取的 pub 缓存会触发
      # :clipboard_watcher:check*AarMetadata 失败（本地已手动把该文件改成 36）。
      # 这里在 pub get 之后、构建之前用 sed 把插件工程的 compileSdk 同步到 36（与 App 对齐）。
      # App 使用 AGP 9.0.1，支持 compileSdk 36，提升后元数据检查通过。
      - name: Patch clipboard_watcher compileSdk (CI 全新 pub 缓存写死 33)
        shell: bash
        run: |
          mapfile -t FILES < <(find "$HOME/.pub-cache" -type f -path '*clipboard_watcher-*/android/build.gradle' 2>/dev/null)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::warning::clipboard_watcher build.gradle not found in pub cache, skip patch"
            exit 0
          fi
          for f in "${FILES[@]}"; do
            echo "Patching $f"
            sed -i -E 's/(compileSdkVersion|compileSdk[[:space:]]*=[[:space:]]*)[[:space:]]*[0-9]+/\1 36/' "$f"
            grep -n "compileSdk" "$f" || true
          done

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: everlink-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
