name: Build Release APK

# 推送任意 tag（如 v1.0.0 / 1.0.0 / 1.1.0）时，自动构建签名 Release APK 并发布到 GitHub Release。
# 更新检查（UpdateService）会从该 Release 读取版本与 APK 下载地址。
# 注意：tag 名称需与 pubspec.yaml 的 version 字段一致（如代码是 1.1.0，则打 tag 1.1.0 或 v1.1.0）。
on:
  push:
    tags:
      - '*'
    # 仅改动文档/图片时不为该 tag 触发整条构建（参考 juejin.cn/post/7080764562609274916）
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: write   # 允许 action-gh-release 创建/更新 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter (3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Decode & convert keystore (AGP-compatible PKCS12)
        run: |
          cd android
          # key.properties 由 Gradle 在 rootProject(android/) 读取；
          # storeFile 相对于 :app 模块(android/app/) 解析，故最终 keystore 落到 android/app/。
          # 1) 解码（去 CRLF 防损坏）到临时源文件
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r' | base64 -d > app/_src-key.jks
          # 快速失败守卫：若 KEYSTORE_BASE64 为空（Secret 未设置 / fork PR 运行不注入 Secret），
          # 解码出的文件是 0 字节，keytool 会报无意义的 ASN.1 错误。提前给出明确提示。
          if [ ! -s app/_src-key.jks ]; then
            echo "::error::解码后的 keystore 为空（0 字节）。请确认仓库 Settings → Secrets and variables → Actions 已设置 KEYSTORE_BASE64（以及 KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS 三个）。注意：fork 的 PR 运行不会注入仓库 Secrets，必须从主仓库打 tag 触发。"
            exit 1
          fi
          # 2) 校验源 keystore 可被 JDK21 keytool 读取（区分“解码损坏”vs“格式不兼容”）
          keytool -list -keystore app/_src-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
          # 3) 用 JDK21 keytool 把同一密钥重写成 AGP 自带 BouncyCastle 能读的 PKCS12。
          #    JDK17+ 默认 PKCS12 用 HmacPBESHA256 做 MAC，会让 apksigner 报
          #    “Tag number over 30 is not supported”；强制 HmacPBESHA1 即兼容。
          #    密钥/证书不变，已发布 App 的更新签名不受影响。
          keytool -importkeystore -noprompt \
            -srckeystore app/_src-key.jks \
            -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -srcalias "${{ secrets.KEY_ALIAS }}" \
            -destkeystore app/everlink-release-key.jks \
            -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -destkeypass "${{ secrets.KEY_PASSWORD }}" \
            -destalias "${{ secrets.KEY_ALIAS }}" \
            -deststoretype PKCS12 \
            -J-Dkeystore.pkcs12.macAlgorithm=HmacPBESHA1
          rm -f app/_src-key.jks
          cat > key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=everlink-release-key.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      # clipboard_watcher 0.3.0 在 android/build.gradle 写死 compileSdk 33，
      # 但其 AndroidX 依赖要求 compileSdk >= 34，CI 全新拉取的 pub 缓存会触发
      # :clipboard_watcher:check*AarMetadata 失败（本地已手动把该文件改成 36）。
      # 这里在 pub get 之后、构建之前用脚本把插件工程的 compileSdk 同步到 36（与 App 对齐）。
      # 脚本会解析 Flutter 生成的 .flutter-plugins-dependencies（权威路径）并兜底搜索
      # $PUB_CACHE / ~/.pub-cache / %LOCALAPPDATA%\Pub\Cache，跨平台且幂等。
      # App 使用 AGP 9.0.1，支持 compileSdk 36，提升后元数据检查通过。
      - name: Patch clipboard_watcher compileSdk (CI 全新 pub 缓存写死 33)
        run: python3 scripts/patch_clipboard_watcher.py

      - name: Build release APK
        run: flutter build apk --release

      - name: List built APKs (diagnostic)
        run: find android -name '*.apk' -print

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动从本次 tag 的提交生成更新说明（UpdateService 会作为 notes 展示）
          generate_release_notes: true
          # 注意 APK 实际位于 android/app/build/.../flutter-apk/（Flutter 把 :app 模块的
          # build 目录放在 android/app/build，而非仓库根的 build/）。用 ** 跨目录通配匹配。
          files: android/**/EverLink-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
