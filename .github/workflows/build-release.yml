name: Build Release APK

# 推送任意 tag（如 v1.0.0 / 1.0.0 / 1.1.0）时，自动构建签名 Release APK 并发布到 GitHub Release。
# 更新检查（UpdateService）会从该 Release 读取版本与 APK 下载地址。
# 注意：tag 名称需与 pubspec.yaml 的 version 字段一致（如代码是 1.1.0，则打 tag 1.1.0 或 v1.1.0）。
on:
  push:
    tags:
      - '*'

permissions:
  contents: write   # 允许 action-gh-release 创建/更新 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter (3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Decode keystore & write key.properties
        run: |
          cd android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > everlink-release-key.jks
          cat > key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=everlink-release-key.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动从本次 tag 的提交生成更新说明（UpdateService 会作为 notes 展示）
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/EverLink-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
