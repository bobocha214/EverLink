name: Build Release APK

# 推送任意 tag（如 v1.0.0 / 1.0.0 / 1.1.0）时，自动构建签名 Release APK 并发布到 GitHub Release。
# 更新检查（UpdateService）会从该 Release 读取版本与 APK 下载地址。
# 注意：tag 名称需与 pubspec.yaml 的 version 字段一致（如代码是 1.1.0，则打 tag 1.1.0 或 v1.1.0）。
on:
  push:
    tags:
      - '*'
    # 仅改动文档/图片时不为该 tag 触发整条构建（参考 juejin.cn/post/7080764562609274916）
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: write   # 允许 action-gh-release 创建/更新 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter (3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Decode keystore & write key.properties
        run: |
          cd android
          # key.properties 由 Gradle 在 rootProject(android/) 读取；
          # 但 storeFile 是相对于 :app 模块(android/app/) 解析的，
          # 所以 keystore 必须落到 android/app/ 下，否则 validateSigningRelease 报 not found。
          # 用 printf+tr 去除 base64 中可能混入的回车，避免解码损坏。
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r' | base64 -d > app/everlink-release-key.jks
          # 预校验：若此处报 “invalid”/“integrity” 等，说明 base64 解码损坏或密钥内容有误；
          # 若此处通过但后面 apksigner 仍报 “Tag number over 30”，则是 JDK17+ PKCS12 的
          # HmacPBESHA256 MAC 与 AGP 自带 BouncyCastle 不兼容，需本地转档（见说明）。
          keytool -list -keystore app/everlink-release-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
          cat > key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=everlink-release-key.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      # clipboard_watcher 0.3.0 在 android/build.gradle 写死 compileSdk 33，
      # 但其 AndroidX 依赖要求 compileSdk >= 34，CI 全新拉取的 pub 缓存会触发
      # :clipboard_watcher:check*AarMetadata 失败（本地已手动把该文件改成 36）。
      # 这里在 pub get 之后、构建之前用脚本把插件工程的 compileSdk 同步到 36（与 App 对齐）。
      # 脚本会解析 Flutter 生成的 .flutter-plugins-dependencies（权威路径）并兜底搜索
      # $PUB_CACHE / ~/.pub-cache / %LOCALAPPDATA%\Pub\Cache，跨平台且幂等。
      # App 使用 AGP 9.0.1，支持 compileSdk 36，提升后元数据检查通过。
      - name: Patch clipboard_watcher compileSdk (CI 全新 pub 缓存写死 33)
        run: python3 scripts/patch_clipboard_watcher.py

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动从本次 tag 的提交生成更新说明（UpdateService 会作为 notes 展示）
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/EverLink-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
