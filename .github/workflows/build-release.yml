name: Build Release

# 推送任意 tag（如 v1.0.0 / 1.0.0 / 1.1.0）时，自动构建并发布到 GitHub Release。
# 所有产物统一命名：EverLink-<版本>-<平台>[-<arch>].<ext>（参考 VSCode/Electron 风格）：
#   - Android：EverLink-<ver>-android.apk / EverLink-<ver>-android-<abi>.apk（ubuntu-latest）
#   - Windows：EverLink-<ver>-windows-x64-setup.exe + EverLink-<ver>-windows-x64-portable.zip（windows-latest）
#   - iOS    ：EverLink-<ver>-ios-unsigned.ipa（macos-latest，未签名，需自行重签才能装真机）
# 更新检查（UpdateService）会从该 Release 读取版本与各平台下载地址。
# 注意：tag 名称需与 pubspec.yaml 的 version 字段一致（如代码是 1.1.0，则打 tag 1.1.0 或 v1.1.0）。
on:
  push:
    tags:
      - '*'
    # 此处不加 paths-ignore：打 tag 的语义就是「我要发版」，不应被文件类型过滤掉。
    # 且 tag push 的 diff 基准不可靠（before 为空提交），曾出现只改 .md 的补丁版本
    # 被静默跳过构建的情况。文档站的构建由独立 workflow 按分支路径过滤。

permissions:
  contents: write   # 允许 action-gh-release 创建/更新 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter (3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Decode & convert keystore (AGP-compatible PKCS12)
        run: |
          set -euo pipefail
          cd android
          # key.properties 由 Gradle 在 rootProject(android/) 读取；
          # storeFile 相对于 :app 模块(android/app/) 解析，故最终 keystore 落到 android/app/。
          # 1) 解码（去 CRLF 防损坏）到临时源文件
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r' | base64 -d > app/_src-key.jks
          # 快速失败守卫：若 KEYSTORE_BASE64 为空（Secret 未设置 / fork PR 运行不注入 Secret），
          # 解码出的文件是 0 字节，keytool 会报无意义的 ASN.1 错误。提前给出明确提示。
          if [ ! -s app/_src-key.jks ]; then
            echo "::error::解码后的 keystore 为空（0 字节）。请确认仓库 Settings → Secrets and variables → Actions 已设置 KEYSTORE_BASE64（以及 KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS 三个）。注意：fork 的 PR 运行不会注入仓库 Secrets，必须从主仓库打 tag 触发。"
            exit 1
          fi
          # 2) 校验源 keystore 可被 JDK21 keytool 读取（区分“解码损坏”vs“格式不兼容”）
          keytool -list -keystore app/_src-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
          # 3) 用 JDK21 keytool 把同一密钥重写成 AGP 自带 BouncyCastle 能读的 PKCS12。
          #    JDK17+ 默认 PKCS12 用 HmacPBESHA256 做 MAC，会让 apksigner 报
          #    “Tag number over 30 is not supported”；强制 HmacPBESHA1 即兼容。
          #    密钥/证书不变，已发布 App 的更新签名不受影响。
          #    注意：源若是 JKS 也能正确转写（keytool 按扩展名推断 store type）。
          keytool -importkeystore -noprompt \
            -srckeystore app/_src-key.jks \
            -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -srcalias "${{ secrets.KEY_ALIAS }}" \
            -destkeystore app/everlink-release-key.jks \
            -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -destkeypass "${{ secrets.KEY_PASSWORD }}" \
            -destalias "${{ secrets.KEY_ALIAS }}" \
            -deststoretype PKCS12 \
            -J-Dkeystore.pkcs12.macAlgorithm=HmacPBESHA1
          rm -f app/_src-key.jks
          # 4) 校验产物 keystore 存在且可被读取；转换任何环节出问题这里会立刻失败，
          #    而不是等到 284s 后的 :app:packageRelease 才炸（那时只会看到 “couldn't find APK”）。
          if [ ! -s app/everlink-release-key.jks ]; then
            echo "::error::转换后的 keystore 为空，keytool 转换未产出文件。请检查 KEY_ALIAS / 各密码 Secret 是否正确。"
            exit 1
          fi
          keytool -list -keystore app/everlink-release-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null \
            && echo "::notice::keystore 转换成功且可被 JDK 读取"
          cat > key.properties <<'EOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=everlink-release-key.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      # clipboard_watcher 0.3.0 在 android/build.gradle 写死 compileSdk 33，
      # 但其 AndroidX 依赖要求 compileSdk >= 34，CI 全新拉取的 pub 缓存会触发
      # :clipboard_watcher:check*AarMetadata 失败（本地已手动把该文件改成 36）。
      # 这里在 pub get 之后、构建之前用脚本把插件工程的 compileSdk 同步到 36（与 App 对齐）。
      # 脚本会解析 Flutter 生成的 .flutter-plugins-dependencies（权威路径）并兜底搜索
      # $PUB_CACHE / ~/.pub-cache / %LOCALAPPDATA%\Pub\Cache，跨平台且幂等。
      # App 使用 AGP 9.0.1，支持 compileSdk 36，提升后元数据检查通过。
      - name: Patch clipboard_watcher compileSdk (CI 全新 pub 缓存写死 33)
        run: python3 scripts/patch_clipboard_watcher.py

      - name: Build release APK
        run: flutter build apk --release

      # 无论构建成功或失败都执行的诊断：把 APK 实际落点、keystore、key.properties
      # 打印出来，方便从日志一眼定位 “couldn't find APK” 的真因（真实 Gradle 报错
      # 通常在本步骤之上的构建日志里，关键词：FAILURE / What went wrong /
      # Execution failed for task ':app:packageRelease' / Tag number over 30）。
      - name: Diagnostics — locate APK & inspect keystore
        if: always()
        run: |
          echo "== any *.apk anywhere in repo =="
          find . -name '*.apk' -print 2>/dev/null || true
          echo "== keystore files =="
          ls -la android/app/*.jks 2>/dev/null || echo "no .jks in android/app"
          echo "== key.properties =="
          cat android/key.properties 2>/dev/null || echo "no key.properties"

      # Release 说明正文取自 CHANGELOG.md 对应版本段落（面向用户的中文描述，
      # UpdateService 会把它展示在应用内更新弹窗里）。段落缺失时脚本输出兜底文案
      # 并以 0 退出，绝不因说明缺失而让整条发布流程失败。
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python3 scripts/extract_changelog.py -o RELEASE_NOTES.md
          echo "===== RELEASE_NOTES.md ====="
          cat RELEASE_NOTES.md

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 正文 = 手写的 CHANGELOG 段落；GitHub 自动生成的提交列表与
          # Full Changelog 链接会由 generate_release_notes 追加在正文之后。
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # Flutter Gradle 插件把 APK 输出到仓库根的 build/app/outputs/flutter-apk/，
          # 不是 android/app/build/。renameEverLinkApk 任务在此目录重命名为 EverLink-*-android*.apk。
          files: build/app/outputs/flutter-apk/EverLink-*-android*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # 版本唯一源 = pubspec.yaml；从 pubspec 读取并断言与 tag 一致。
      - name: Derive & verify version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::pubspec.yaml 版本($VER) 与 tag($TAG) 不一致，请先 bump 版本再打 tag"
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # 安装包：windows-latest 预装 Inno Setup 6（C:\Program Files (x86)\Inno Setup 6\ISCC.exe）。
      # /DMyAppVersion 注入版本号；/O 用绝对路径，确保产物落到仓库根 build\windows\installer，
      # 与下方 Publish 步骤的 files 路径一致。ISCC 是控制台程序，用 `& ... *> log` 把全部流
      # 重定向到日志文件再打印，规避此前经 Start-Process 重定向导致 stdout 丢失、出现"没日志"的问题。
      - name: Build installer (exe)
        shell: pwsh
        env:
          APPVER: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            Write-Host "::warning::Inno Setup 6 未预装，尝试通过 Chocolatey 安装..."
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup 6 安装后仍不可用"; exit 1 }
          Write-Host "使用 ISCC: $iscc"

          $outDir = Join-Path $PWD "build\windows\installer"
          if (-not (Test-Path $outDir)) { New-Item -ItemType Directory -Path $outDir | Out-Null }

          # 预检：Release 产物与图标必须存在，否则提前给出明确错误
          $relDir = Join-Path $PWD "build\windows\x64\runner\Release"
          Write-Host "Release 目录存在: $(Test-Path $relDir)"
          Write-Host "图标存在: $(Test-Path (Join-Path $PWD 'windows\runner\resources\app_icon.ico'))"
          if (-not (Test-Path $relDir)) {
            Write-Error "flutter build windows 未产出 Release 目录：$relDir"; exit 1
          }

          $log = Join-Path $outDir "iscc_build.log"
          & $iscc "windows\installer.iss" "/DMyAppVersion=$env:APPVER" "/O$outDir" *> $log
          $ec = $LASTEXITCODE
          Write-Host "=== ISCC 完整日志 (exit=$ec) ==="
          if (Test-Path $log) { Get-Content $log -Raw }
          $exePath = Join-Path $outDir "EverLink-$env:APPVER-windows-x64-setup.exe"
          if ($ec -ne 0) { Write-Error "iscc 失败 (exit $ec)，详见上方日志"; exit 1 }
          if (-not (Test-Path $exePath)) { Write-Error "iscc 退出码 0 但未找到产物：$exePath"; exit 1 }
          Write-Host "安装包已生成: $exePath"

      # 无论 installer/portable 成功或失败，都输出关键目录与 ISCC 日志，便于从 CI 日志定位真因。
      - name: Diagnostics — Windows build state
        if: always()
        shell: pwsh
        run: |
          Write-Host "== installer 输出目录 =="
          if (Test-Path "build\windows\installer") { Get-ChildItem "build\windows\installer" | Format-Table Name, Length }
          else { Write-Host "(无 build\windows\installer)" }
          Write-Host "== Release 目录前 30 项 =="
          if (Test-Path "build\windows\x64\runner\Release") { Get-ChildItem "build\windows\x64\runner\Release" | Select-Object -First 30 | Format-Table Name, Length }
          else { Write-Host "(无 Release 目录 -> flutter build windows 未成功)" }
          Write-Host "== ISCC 日志 =="
          if (Test-Path "build\windows\installer\iscc_build.log") { Get-Content "build\windows\installer\iscc_build.log" -Raw }
          else { Write-Host "(无 iscc_build.log)" }

      - name: Package portable zip
        shell: pwsh
        env:
          APPVER: ${{ steps.ver.outputs.version }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/package_windows.ps1 -Version $env:APPVER -OutputDir build\windows\installer

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 首个（APK）job 已生成 Release 说明；此处仅追加 Windows 附件。
          files: |
            build/windows/installer/EverLink-*-windows-x64-setup.exe
            build/windows/installer/EverLink-*-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (3.44.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # 版本唯一源 = pubspec.yaml；从 pubspec 读取并断言与 tag 一致。
      - name: Derive & verify version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::pubspec.yaml 版本($VER) 与 tag($TAG) 不一致，请先 bump 版本再打 tag"
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      # macOS runner 预装 CocoaPods；flutter build ios 会自动执行 pod install。
      # --no-codesign 产出未签名 Runner.app（无需 Apple 证书即可构建）。
      - name: Build iOS app (release, unsigned)
        run: flutter build ios --release --no-codesign

      # 手工打包未签名 IPA：将 Runner.app 放入 Payload 目录后压缩为 .ipa。
      # 文件名显式带 -unsigned，提醒用户这是未签名包（需重签才能装真机）。
      # 说明：未签名 IPA 无法直接安装到真机，需自行重签（如 AltStore / Sideloadly）。
      #   若已配置 Apple 签名 Secrets（IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROFILE_BASE64），
      #   可改为 `flutter build ipa --export-options-plist=ios/ExportOptions.plist` 产出已签名 IPA。
      - name: Package IPA
        env:
          APPVER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "::error::flutter build ios 未产出 Runner.app（期望路径：$APP）"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "EverLink-${APPVER}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -la "EverLink-${APPVER}-ios-unsigned.ipa"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 首个 job 已生成 Release 说明；此处仅追加 iOS 附件。
          files: EverLink-*-ios-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
